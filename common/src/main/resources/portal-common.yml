spring:
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      connect-timeout: 2s
      timeout: 2s
server:
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
portal:
  docs:
    enabled: false
  security:
    issuer: next-portal
    access-ttl: 15m
    refresh-ttl: 7d
springdoc:
  api-docs:
    enabled: ${portal.docs.enabled:false}
  swagger-ui:
    enabled: ${portal.docs.enabled:false}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    with-credentials: true
    persist-authorization: false
    validator-url: none
  paths-to-match: /api/**
