# Copy to application-local.yml or run scripts/init-local.ps1.
# This file is a template. The actual local file stays outside JARs and Git.
spring:
  datasource:
    url: "jdbc:mariadb://localhost:3306/portal"
    username: "next_portal"
    password: "" # local-db-password
  data:
    redis:
      host: "localhost"
      port: 6379
      password: ""
      database: 0
portal:
  ports:
    admin: 8080
    user: 8081
  security:
    secret: "" # local-jwt-secret
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:3001"
    secure-cookie: false
  bootstrap-admin:
    email: "" # bootstrap-admin-email
    password: "" # bootstrap-admin-password
